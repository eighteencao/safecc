[General]
# Strict mode: do not use system DNS directly and do not prefer IPv6.
dns-server = 1.1.1.1, 168.95.1.1
encrypted-dns-server = https://1.1.1.1/dns-query, https://dns.google/dns-query
dns-direct-system = false
ipv6 = false
prefer-ipv6 = false
icmp-auto-reply = true
private-ip-answer = true

[Rule]
# Rule 1: hard block every IPv6 destination.
IP-CIDR6,::/0,REJECT,no-resolve

# Rule 2: send every remaining destination through the selected server.
# There are intentionally no DIRECT, GEOIP, LAN, Apple or captive-portal exceptions.
FINAL,PROXY
