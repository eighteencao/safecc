[General]
# Balanced mode: mainland China services use direct IPv4; other public traffic
# uses the currently selected Shadowrocket server. Public IPv6 is blocked.
dns-server = 1.1.1.1, 168.95.1.1
encrypted-dns-server = https://1.1.1.1/dns-query, https://dns.google/dns-query
dns-direct-system = false
ipv6 = false
prefer-ipv6 = false
icmp-auto-reply = true
private-ip-answer = true

[Rule]
# Block every IPv6 destination before any other rule can match.
IP-CIDR6,::/0,REJECT,no-resolve

# Local network and captive-portal access.
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,local,DIRECT
DOMAIN,captive.apple.com,DIRECT

# WeChat / Tencent: keep messaging, media and common CDN traffic direct.
DOMAIN-SUFFIX,wechat.com,DIRECT
DOMAIN-SUFFIX,weixin.com,DIRECT
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wx.qq.com,DIRECT
DOMAIN-SUFFIX,qq.com,DIRECT
DOMAIN-SUFFIX,qpic.cn,DIRECT
DOMAIN-SUFFIX,qlogo.cn,DIRECT
DOMAIN-SUFFIX,gtimg.com,DIRECT
DOMAIN-SUFFIX,tencent.com,DIRECT
DOMAIN-SUFFIX,myqcloud.com,DIRECT
DOMAIN-SUFFIX,weixinbridge.com,DIRECT

# Mainland China IPv4 destinations go direct. This intentionally exposes the
# device's normal public IPv4 to those destinations.
GEOIP,CN,DIRECT

# Everything else follows the currently selected Shadowrocket server.
FINAL,PROXY
