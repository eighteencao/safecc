[package]
name = "claude_environment_assistant"
version = "0.1.0"
description = "Local-first environment checks and network configuration previews"
authors = ["Claude Environment Assistant"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "claude_environment_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
